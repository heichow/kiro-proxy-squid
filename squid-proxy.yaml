AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Squid forward proxy on EC2 in ap-southeast-1 (Singapore).
  Allows Kiro IDE to route traffic through this proxy via HTTPS_PROXY.

Parameters:
  AllowedIP:
    Type: String
    Description: >
      Your laptop's public IP (CIDR format, e.g. 1.2.3.4/32).
      Find it at https://checkip.amazonaws.com
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR (e.g. 203.0.113.10/32)

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type

Resources:
  # --- VPC (simple single-AZ setup) ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: squid-proxy-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: squid-proxy-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: squid-proxy-subnet

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: squid-proxy-rt

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # --- Security Group ---
  SquidSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and Squid proxy from your IP only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3128
          ToPort: 3128
          CidrIp: !Ref AllowedIP
          Description: Squid proxy from your IP
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound (Kiro API, SSM)
      Tags:
        - Key: Name
          Value: squid-proxy-sg

  # --- IAM Role (for SSM Session Manager - no SSH key needed) ---
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: squid-proxy-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --- Elastic IP (static, survives stop/start) ---
  SquidEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: squid-proxy-eip

  SquidEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt SquidEIP.AllocationId
      InstanceId: !Ref SquidInstance

  # --- EC2 Instance ---
  SquidInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SquidSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > >(tee /var/log/user-data.log) 2>&1

          echo "=== Installing Squid ==="
          dnf install squid -y

          echo "=== Configuring Squid ==="
          cat > /etc/squid/squid.conf << 'SQUIDCONF'
          # --- Squid Forward Proxy for Kiro IDE ---

          # ACL definitions
          acl localnet src 10.0.0.0/8
          acl localnet src 172.16.0.0/12
          acl localnet src 192.168.0.0/16
          acl SSL_ports port 443
          acl Safe_ports port 80
          acl Safe_ports port 443
          acl CONNECT method CONNECT

          # Security: deny non-safe ports and CONNECT to non-SSL ports
          http_access deny !Safe_ports
          http_access deny CONNECT !SSL_ports

          # Allow all traffic through (access restricted by security group)
          http_access allow all

          # Listen on port 3128
          http_port 3128

          # Logging
          access_log /var/log/squid/access.log squid
          cache_log /var/log/squid/cache.log

          # Performance
          maximum_object_size 0 MB
          cache deny all

          # Timeouts
          connect_timeout 60 seconds
          read_timeout 600 seconds
          request_timeout 600 seconds

          # Hide proxy headers (optional privacy)
          via off
          forwarded_for delete
          SQUIDCONF

          echo "=== Starting Squid ==="
          systemctl enable squid
          systemctl start squid

          echo "=== Squid setup complete ==="
      Tags:
        - Key: Name
          Value: squid-proxy

Outputs:
  ProxyURL:
    Description: >
      Set this as HTTPS_PROXY in Kiro IDE settings or environment.
    Value: !Sub 'http://${SquidEIP}:3128'

  InstancePublicIP:
    Description: Static Elastic IP address (survives instance stop/start)
    Value: !Ref SquidEIP

  SSMConnect:
    Description: Connect via SSM Session Manager (no SSH key needed)
    Value: !Sub 'aws ssm start-session --target ${SquidInstance} --region ap-southeast-1'

  CheckLogs:
    Description: Command to check Squid access logs (run on the instance)
    Value: 'sudo tail -f /var/log/squid/access.log'
